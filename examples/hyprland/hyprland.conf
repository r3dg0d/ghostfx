# GhostFX + Hyprland example bindings.
# These use the imperative CLI, so they suit setups where ~/.config/ghostty/config
# is NOT managed by Home Manager (otherwise switch shaders in Nix instead).

# Random favourite shader (Ghostty reloads via SIGUSR2 automatically).
bind = SUPER SHIFT, G, exec, ghostfx random --favorites --apply --replace
# Turn effects off / back on.
bind = SUPER ALT, G, exec, ghostfx disable
# Interactive browser in a floating Ghostty window.
bind = SUPER, G, exec, ghostty --class=ghostfx.browser -e ghostfx tui
windowrulev2 = float, class:^(ghostfx\.browser)$
windowrulev2 = size 1100 700, class:^(ghostfx\.browser)$

# Ghostty only animates shaders while focused by default. For a live
# background in every visible terminal set this in your Ghostty config
# (uses more power):
#   custom-shader-animation = always
