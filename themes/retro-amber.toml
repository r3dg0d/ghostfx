# GhostFX palette: Retro Amber
# Apply with: ghostfx apply <shader> --palette retro-amber
name = "Retro Amber"

[colors]
primary = "#FFB000"
secondary = "#1C0F00"
accent = "#FFE7B0"
# background/foreground are only used by legacy builds (Ghostty < 1.3),
# which cannot read the terminal colours from uniforms.
background = "#0F0800"
foreground = "#FFE9C2"
