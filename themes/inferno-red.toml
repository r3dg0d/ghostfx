# GhostFX palette: Inferno Red
# Apply with: ghostfx apply <shader> --palette inferno-red
name = "Inferno Red"

[colors]
primary = "#FF3B1F"
secondary = "#3A0500"
accent = "#FFC66B"
# background/foreground are only used by legacy builds (Ghostty < 1.3),
# which cannot read the terminal colours from uniforms.
background = "#0E0302"
foreground = "#FFE4D6"
