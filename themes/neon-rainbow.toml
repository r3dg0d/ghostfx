# GhostFX palette: Neon Rainbow
# Apply with: ghostfx apply <shader> --palette neon-rainbow
name = "Neon Rainbow"

[colors]
primary = "#FF2BD6"
secondary = "#0A0418"
accent = "#2BF0FF"
# background/foreground are only used by legacy builds (Ghostty < 1.3),
# which cannot read the terminal colours from uniforms.
background = "#07030F"
foreground = "#F5F0FF"
